<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';">
<title>Gadget Weekly — Top 10 Fun &amp; Handy Gadgets, Every Week</title>
<meta name="description" content="A new Top 10 list of fun and handy gadgets every week — fast charging gear, clever home gadgets, and small things that are actually worth buying.">
<link rel="canonical" href="https://thomzzen.github.io/visitcounter/blog/">
<meta property="og:type" content="website">
<meta property="og:title" content="Gadget Weekly — Top 10 Fun & Handy Gadgets, Every Week">
<meta property="og:description" content="A new Top 10 list of fun and handy gadgets every week — fast charging gear, clever home gadgets, and small things that are actually worth buying.">
<meta property="og:url" content="https://thomzzen.github.io/visitcounter/blog/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Gadget Weekly — Top 10 Fun & Handy Gadgets, Every Week">
<meta name="twitter:description" content="A new Top 10 list of fun and handy gadgets every week.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <nav class="nav">
    <div class="brand"><span class="dot"></span> gadgetweekly.</div>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <details class="nav-dropdown">
        <summary>Categories</summary>
        <div class="nav-dropdown-menu" id="categoryMenu"></div>
      </details>
    </div>
  </nav>

  <section class="hero" id="hero"></section>

  <div class="section-label">
    <span id="sectionLabelText">Latest drops</span>
    <div class="line"></div>
    <button class="icon-btn" onclick="document.getElementById('archive').scrollIntoView({behavior:'smooth'})" title="See all posts">&darr;</button>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div class="grid" id="archive"></div>

  <footer>
    Handpicked every week. Nothing sponsored unless we say so. &copy; <span id="year"></span> gadgetweekly.
    &middot; <a href="disclosure.html">Affiliate disclosure</a>
  </footer>
</div>

<script src="posts.js"></script>
<script src="labels.js"></script>
<script src="categories.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const categories = (typeof CATEGORIES !== "undefined") ? CATEGORIES : [];
  const requestedCat = new URLSearchParams(location.search).get("cat");
  const currentCat = categories.length
    ? (categories.some(c => c.id === requestedCat) ? requestedCat : categories[0].id)
    : null;

  document.getElementById("categoryMenu").innerHTML = categoryMenuHtml("", currentCat);
  wireNavDropdowns();

  const allPosts = loadAllPosts();
  const posts = currentCat ? allPosts.filter(p => p.category === currentCat) : allPosts;
  const heroEl = document.getElementById("hero");
  const filterBarEl = document.getElementById("filterBar");
  const gridEl = document.getElementById("archive");
  let activeTag = null;

  if (currentCat && categories.length > 1) {
    document.getElementById("sectionLabelText").textContent = `Latest in ${categoryName(currentCat)}`;
  }

  function currentLabels() {
    if (!currentCat || typeof LABELS === "undefined") return [];
    return LABELS[currentCat] || [];
  }

  function renderFilterBar() {
    const labels = currentLabels();
    if (!labels.length) { filterBarEl.innerHTML = ""; return; }
    filterBarEl.innerHTML = `
      <button class="filter-pill${activeTag === null ? " active" : ""}" data-tag="">All</button>
      ${labels.map(t => `<button class="filter-pill${activeTag === t ? " active" : ""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("")}
    `;
    filterBarEl.querySelectorAll(".filter-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTag = btn.dataset.tag || null;
        renderFilterBar();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const filtered = activeTag ? posts.filter(p => p.items.some(i => i.tag === activeTag)) : posts;
    gridEl.innerHTML = filtered.length
      ? filtered.map(postCardHtml).join("")
      : `<div class="empty-state">No posts tagged "${escapeHtml(activeTag)}" yet.</div>`;
  }

  if (posts.length === 0) {
    heroEl.outerHTML = allPosts.length
      ? `<div class="empty-state">No posts in ${escapeHtml(categoryName(currentCat))} yet. Check back soon.</div>`
      : `<div class="empty-state">No posts yet. Check back soon.</div>`;
  } else {
    const latest = posts[0];
    const heroWord = currentCat ? categoryName(currentCat).toLowerCase() : "gadgets";
    heroEl.innerHTML = `
      <div class="hero-copy">
        <div class="hero-eyebrow">${latest.weekLabel} &middot; ${formatDate(latest.date)}</div>
        <h1>top 10<br>${escapeHtml(heroWord)}.</h1>
        <p class="lede">${escapeHtml(latest.excerpt)}</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="${postHref(latest)}">Read this week's list &rarr;</a>
        </div>
      </div>
      <a class="hero-visual" href="${postHref(latest)}">
        <span class="rank-badge">Latest post</span>
        <img src="${escapeHtml(latest.cover)}" alt="${escapeHtml(latest.title)}">
        <div class="price-tag">
          <span class="name">${escapeHtml(latest.title)}</span>
          <span class="price">${escapeHtml(latest.weekLabel)}</span>
        </div>
      </a>
    `;
    renderFilterBar();
    renderGrid();
  }
</script>
</body>
</html>
