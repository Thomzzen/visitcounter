name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate static post pages + sitemap
        run: node blog/build.js
      - name: Decide what to deploy
        id: sitepath
        run: |
          if [ -f OFFLINE ]; then
            echo "OFFLINE marker found -- deploying the maintenance placeholder instead of the real site."
            mkdir -p _offline_site
            cp maintenance.html _offline_site/index.html
            echo "path=./_offline_site" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.sitepath.outputs.path }}
      - id: deployment
        uses: actions/deploy-pages@v4
